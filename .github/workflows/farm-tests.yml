name: Farm tests
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  farm:
    name: Simulated farm API
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -v
